<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <main class="container">
    <header class="header">
      <div class="header-icon">✅</div>
      <h1>My Tasks</h1>
      <p class="subtitle">Atur hari-harimu dengan efisien</p>
    </header>

    <div class="stats-bar">
      <div class="stat">
        <span id="stat-total" class="stat-value">0</span>
        <span class="stat-label">Total</span>
      </div>
      <div class="stat">
        <span id="stat-active" class="stat-value">0</span>
        <span class="stat-label">Aktif</span>
      </div>
      <div class="stat">
        <span id="stat-done" class="stat-value">0</span>
        <span class="stat-label">Selesai</span>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrapper">
        <span class="input-icon">📝</span>
        <input
          type="text"
          id="todo-input"
          placeholder="Tambah task baru..."
          maxlength="120"
          autocomplete="off"
        />
        <select id="priority-select" title="Prioritas">
          <option value="low">🟢 Rendah</option>
          <option value="medium" selected>🟡 Sedang</option>
          <option value="high">🔴 Tinggi</option>
        </select>
      </div>
      <button id="add-btn" title="Tambah Task">
        <span>+</span>
      </button>
    </div>

    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">Semua</button>
      <button class="filter-btn" data-filter="active">Aktif</button>
      <button class="filter-btn" data-filter="done">Selesai</button>
    </div>

    <ul id="todo-list" class="todo-list"></ul>

    <div id="empty-state" class="empty-state hidden">
      <div class="empty-icon">🎉</div>
      <p>Tidak ada task di sini!</p>
    </div>

    <div class="footer-actions">
      <button id="clear-done-btn">🗑️ Hapus Selesai</button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
